name: CD

# CD ne se déclenche que sur `main` (pas sur DEV_Schama) : la branche de dev
# fait tourner la CI seule, `main` déclenche la publication de l'image ET
# le redéploiement sur Render (US-20/US-21).
#
# Le rollback (US-21) reste manuel et documenté : chaque image est taguée
# `v<run_number>` en plus de `latest` sur GHCR — pour revenir en arrière,
# redéployer manuellement le tag précédent depuis le dashboard Render
# (Manual Deploy -> Deploy a specific image) ou via son Deploy Hook.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ github.run_number }}

      - name: Deploy API to Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set — skipping deploy trigger."
            exit 1
          fi
          curl -f -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered for the API."

      - name: Build and push Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-streamlit:latest
            ghcr.io/${{ github.repository }}-streamlit:v${{ github.run_number }}

      - name: Deploy Streamlit to Render
        run: |
          if [ -z "${{ secrets.RENDER_STREAMLIT_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_STREAMLIT_DEPLOY_HOOK_URL secret is not set — skipping deploy trigger."
            exit 1
          fi
          curl -f -s -X POST "${{ secrets.RENDER_STREAMLIT_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered for Streamlit."
