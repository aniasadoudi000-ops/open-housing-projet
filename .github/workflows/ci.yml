name: CI

on:
  push:
    branches: [main, DEV_Schama]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run test suite
        run: pytest -q

      - name: Smoke-check the Streamlit entrypoint
        run: python -m compileall mvp/src/open_housing_mvp
