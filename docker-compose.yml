services:
  api:
    build: .
    container_name: openhousing-api
    command: uvicorn open_housing_mvp.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  streamlit:
    build: .
    container_name: openhousing-streamlit
    command: streamlit run mvp/src/open_housing_mvp/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - api
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      OPEN_HOUSING_API_URL: http://api:8000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
